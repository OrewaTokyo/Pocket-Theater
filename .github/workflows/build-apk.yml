name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site.zip"]   # a pushed site.zip is unpacked first; the unpack workflow then starts this build
concurrency:
  group: build-apk
  cancel-in-progress: false
jobs:
  checks:
    permissions:
      contents: read
    # The quick tests run first. If one fails, no APK is built or published, so a broken change never reaches your phone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Quick checks
        run: |
          node tests/check-structure.js
          for t in tests/unit/*.test.js; do echo "== $t"; node "$t" || exit 1; done
  build:
    permissions:
      contents: write   # publishing the release needs this; the quick checks above do not
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Work out the version of this build
        id: ver
        run: |
          BASE=$(grep -m1 -oE 'versionName = System.getenv\("APP_VERSION_NAME"\) \?: "[^"]+"' app/build.gradle.kts | grep -oE '"[^"]+"$' | tr -d '"')
          echo "name=$BASE-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # Minutes since 2023-11-14. It only ever goes up, so Android never sees a downgrade.
          echo "code=$(( ($(date +%s) - 1700000000) / 60 ))" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: gradle assembleDebug --no-daemon
      - name: Check the APK has the right id, version, permissions and signature
        id: fp
        run: bash tools/ci/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk "${{ steps.ver.outputs.code }}" "${{ steps.ver.outputs.name }}"
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "PocketTheater-v${{ steps.ver.outputs.name }}.apk"
      - name: Publish a new release for this build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Pocket Theater v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          body: "Debug build, version code ${{ steps.ver.outputs.code }}, signing key SHA-256 ${{ steps.fp.outputs.key }}. If Android refuses to install it over the old one, uninstall the old one first (see docs/setup/build-and-install.md)."
          generate_release_notes: true
          files: PocketTheater-v${{ steps.ver.outputs.name }}.apk
